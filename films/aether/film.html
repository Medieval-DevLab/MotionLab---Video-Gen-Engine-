<!doctype html>
<html><head><meta charset="utf-8"><title>Aether</title>
<link rel="stylesheet" href="../../styles/journey/tokens.css">

<style>
  .chapter { position: absolute; inset: 0; }
  .risk-card .hdr { display: flex; align-items: center; gap: 20px; padding: 20px 24px 12px; }
  .risk-card .scan { height: 4px; margin: 4px 24px 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .risk-card .scan i { display: block; height: 100%; width: 100%; background: var(--purple); transform-origin: 0 50%; }
  .rrow { position: absolute; left: 24px; right: 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .rrow .k-pill { position: static; }
  .opt .crit { position: absolute; left: 28px; display: flex; align-items: center; gap: 12px; color: var(--ink-2); }
  .opt .crit .ico { color: var(--purple); }
  .opt .otitle { position: absolute; left: 28px; top: 104px; width: 344px; font-size: var(--sub); line-height: var(--sub-lh); }
  .opt .badge { position: absolute; left: 28px; top: 28px; }
  .opt .divider { position: absolute; left: 28px; right: 28px; top: 232px; height: 1px; background: var(--line); }
  .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #D7A8FF; }
</style></head>
