<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../styles/journey/tokens.css">
<!-- Style frame A: "A shipment is delayed in Singapore. Three factories have just 48 hours of inventory remaining."

<style>
  .scene { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .delayed { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px 0 16px; background: #FDECEE; color: var(--risk); }
  .meter { display: flex; align-items: center; gap: 12px; }
  .meter svg { width: 32px; height: 32px; color: var(--risk); }
</style><style>.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.chip.l{width:128px;height:128px}.chip.l svg{width:56px;height:56px}</style></head>

      <rect x="312" y="672" width="64" height="64" rx="6" fill="#4A3A63"/>
      <rect x="324" y="684" width="16" height="10" rx="2" fill="#F7F5FA" opacity=".8"/>
      <rect x="348" y="684" width="16" height="10" rx="2" fill="#F7F5FA" opacity=".8"/>

        <rect x="542" y="660" width="56" height="36" rx="3" fill="#CFA0FF"/>

    <circle cx="736" cy="768" r="9" fill="#A100FF"/>

      <polygon points="1398,532 1398,504 1437,532 1437,504 1476,532 1476,504 1516,532" fill="#D6C6EE"/>

    <use href="#factory" y="148"/>
    <use href="#factory" y="296"/>

  <!-- labels and state, 16 px from their objects, on the grid -->
  <div class="abs card pill delayed t-label" style="left:418px; top:588px;">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>

</div>
